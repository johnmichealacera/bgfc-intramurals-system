<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2. Rapid Application Development Diagram</title>
  <desc id="desc">Five-phase Rapid Application Development methodology used for the BGFC Intramurals Tabulation System, with iterative feedback between phases.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .phase-num { font: 700 12px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .phase-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .phase-item { font: 500 11px Arial, Helvetica, sans-serif; fill: #334155; }
      .flow { font: 600 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .loop { font: 600 12px Arial, Helvetica, sans-serif; fill: #0f766e; }
      .note { font: 500 11px Arial, Helvetica, sans-serif; fill: #64748b; }
      .badge { font: 700 11px Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="36" text-anchor="middle" class="title">Rapid Application Development (RAD) Methodology</text>
  <text x="800" y="58" text-anchor="middle" class="subtitle">BGFC Intramurals Tabulation System</text>

  <!-- Overview strip -->
  <rect x="40" y="78" width="1520" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="800" y="100" text-anchor="middle" class="flow">RAD emphasizes rapid prototyping, continuous user feedback, and iterative refinement</text>
  <text x="800" y="118" text-anchor="middle" class="note">rather than a single long design-then-build cycle</text>

  <!-- PHASE 1 -->
  <g transform="translate(40,160)">
    <rect width="280" height="420" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.75"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#2563eb"/>
    <rect x="0" y="36" width="280" height="12" fill="#2563eb"/>
    <text x="140" y="30" text-anchor="middle" class="phase-num">PHASE 1</text>
    <text x="140" y="78" text-anchor="middle" class="phase-title">System Analysis</text>
    <text x="140" y="98" text-anchor="middle" class="phase-title">and Design</text>

    <text x="24" y="140" class="phase-item">- Requirements gathering</text>
    <text x="24" y="164" class="phase-item">- Review of manual tallying</text>
    <text x="24" y="188" class="phase-item">  process at BGFC</text>
    <text x="24" y="212" class="phase-item">- PRISAA guidelines review</text>
    <text x="24" y="236" class="phase-item">- Core entity identification</text>
    <text x="24" y="260" class="phase-item">  (Season, Team, Event,</text>
    <text x="24" y="284" class="phase-item">  Match, Placement, User)</text>
    <text x="24" y="308" class="phase-item">- Data model design</text>
    <text x="24" y="332" class="phase-item">- Technology selection</text>
    <text x="24" y="356" class="phase-item">- Information architecture</text>
    <text x="24" y="390" class="phase-item">  Next.js, Prisma, PostgreSQL,</text>
    <text x="24" y="410" class="phase-item">  NextAuth.js, Tailwind CSS</text>
  </g>

  <!-- arrow 1 -> 2 -->
  <line x1="320" y1="370" x2="348" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PHASE 2 -->
  <g transform="translate(350,160)">
    <rect width="280" height="420" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#059669"/>
    <rect x="0" y="36" width="280" height="12" fill="#059669"/>
    <text x="140" y="30" text-anchor="middle" class="phase-num">PHASE 2</text>
    <text x="140" y="78" text-anchor="middle" class="phase-title">Development</text>
    <text x="140" y="98" text-anchor="middle" class="phase-title">of the System</text>

    <text x="24" y="140" class="phase-item">- Environment setup</text>
    <text x="24" y="164" class="phase-item">- Database design and</text>
    <text x="24" y="188" class="phase-item">  migrations</text>
    <text x="24" y="220" class="phase-item">Iterative builds:</text>
    <text x="24" y="244" class="phase-item">1. Auth and role foundation</text>
    <text x="24" y="268" class="phase-item">2. Season, team, users</text>
    <text x="24" y="292" class="phase-item">3. Sports and events</text>
    <text x="24" y="316" class="phase-item">4. Live scoring</text>
    <text x="24" y="340" class="phase-item">5. Finalization and standings</text>
    <text x="24" y="364" class="phase-item">6. Public site</text>
    <text x="24" y="400" class="phase-item">Working prototype each cycle</text>
  </g>

  <!-- arrow 2 -> 3 -->
  <line x1="630" y1="370" x2="658" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PHASE 3 -->
  <g transform="translate(660,160)">
    <rect width="280" height="420" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.75"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#ea580c"/>
    <rect x="0" y="36" width="280" height="12" fill="#ea580c"/>
    <text x="140" y="30" text-anchor="middle" class="phase-num">PHASE 3</text>
    <text x="140" y="78" text-anchor="middle" class="phase-title">System</text>
    <text x="140" y="98" text-anchor="middle" class="phase-title">Testing</text>

    <text x="24" y="140" class="phase-item">- Continuous testing during</text>
    <text x="24" y="164" class="phase-item">  development</text>
    <text x="24" y="188" class="phase-item">- Manual and automated</text>
    <text x="24" y="212" class="phase-item">  browser testing</text>
    <text x="24" y="236" class="phase-item">- Concurrency and edge-case</text>
    <text x="24" y="260" class="phase-item">  testing (live scores,</text>
    <text x="24" y="284" class="phase-item">  active season, ties)</text>
    <text x="24" y="308" class="phase-item">- Cross-role testing</text>
    <text x="24" y="332" class="phase-item">  (ADMIN vs TABULATOR)</text>
    <text x="24" y="356" class="phase-item">- End-to-end match and</text>
    <text x="24" y="380" class="phase-item">  placement scenarios</text>
    <text x="24" y="410" class="phase-item">Defects return to Phase 2</text>
  </g>

  <!-- arrow 3 -> 4 -->
  <line x1="940" y1="370" x2="968" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PHASE 4 -->
  <g transform="translate(970,160)">
    <rect width="280" height="420" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.75"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#7c3aed"/>
    <rect x="0" y="36" width="280" height="12" fill="#7c3aed"/>
    <text x="140" y="30" text-anchor="middle" class="phase-num">PHASE 4</text>
    <text x="140" y="78" text-anchor="middle" class="phase-title">System</text>
    <text x="140" y="98" text-anchor="middle" class="phase-title">Implementation</text>

    <text x="24" y="140" class="phase-item">- Deployment preparation</text>
    <text x="24" y="164" class="phase-item">- Separate local and</text>
    <text x="24" y="188" class="phase-item">  production databases</text>
    <text x="24" y="212" class="phase-item">- Secrets kept out of</text>
    <text x="24" y="236" class="phase-item">  version control</text>
    <text x="24" y="260" class="phase-item">- Technical README</text>
    <text x="24" y="284" class="phase-item">- User guide for admins,</text>
    <text x="24" y="308" class="phase-item">  tabulators, spectators</text>
    <text x="24" y="332" class="phase-item">- Season-setup checklist</text>
    <text x="24" y="356" class="phase-item">- Day-of-event scoring</text>
    <text x="24" y="380" class="phase-item">  workflow documentation</text>
    <text x="24" y="410" class="phase-item">Ready for institutional use</text>
  </g>

  <!-- arrow 4 -> 5 -->
  <line x1="1250" y1="370" x2="1278" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PHASE 5 -->
  <g transform="translate(1280,160)">
    <rect width="280" height="420" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.75"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#dc2626"/>
    <rect x="0" y="36" width="280" height="12" fill="#dc2626"/>
    <text x="140" y="30" text-anchor="middle" class="phase-num">PHASE 5</text>
    <text x="140" y="78" text-anchor="middle" class="phase-title">System</text>
    <text x="140" y="98" text-anchor="middle" class="phase-title">Evaluation</text>

    <text x="24" y="140" class="phase-item">- ISO 9126-1 quality model</text>
    <text x="24" y="172" class="phase-item">Quality characteristics:</text>
    <text x="24" y="196" class="phase-item">- Functionality</text>
    <text x="24" y="220" class="phase-item">- Reliability</text>
    <text x="24" y="244" class="phase-item">- Usability</text>
    <text x="24" y="268" class="phase-item">- Efficiency</text>
    <text x="24" y="292" class="phase-item">- Maintainability</text>
    <text x="24" y="316" class="phase-item">- Portability</text>
    <text x="24" y="348" class="phase-item">- Results presented in</text>
    <text x="24" y="372" class="phase-item">  Chapter 5</text>
    <text x="24" y="410" class="phase-item">Feedback informs refinements</text>
  </g>

  <!-- Iterative feedback loop: Phase 3 findings return to Phase 2 -->
  <path d="M 800 585 L 800 630 L 490 630 L 490 585" fill="none" stroke="#0f766e" stroke-width="2.25" stroke-dasharray="7 4" marker-end="url(#arrow-teal)"/>
  <rect x="545" y="648" width="310" height="34" rx="8" fill="#0f766e"/>
  <text x="700" y="670" text-anchor="middle" class="badge">Iterative Feedback Loop (Build - Test - Refine)</text>

  <!-- Bottom legend / outcome -->
  <rect x="40" y="740" width="1520" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="800" y="770" text-anchor="middle" class="flow">How RAD was applied in this project</text>
  <text x="800" y="798" text-anchor="middle" class="phase-item">Each development iteration produced a usable increment that could be tested immediately.</text>
  <text x="800" y="820" text-anchor="middle" class="phase-item">Findings from testing and evaluation fed back into design and construction, enabling fast refinement of scoring,</text>
  <text x="800" y="842" text-anchor="middle" class="phase-item">standings, and role behavior before final implementation and quality evaluation.</text>
</svg>
