<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. System Architecture of the BGFC Intramurals Tabulation System</title>
  <desc id="desc">Landscape layered architecture showing users, presentation, application, domain services, data access, and PostgreSQL storage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .layer-label { font: 700 12px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-sub { font: 500 11px Arial, Helvetica, sans-serif; fill: #334155; }
      .box-tiny { font: 500 10px Arial, Helvetica, sans-serif; fill: #475569; }
      .flow { font: 600 11px Arial, Helvetica, sans-serif; fill: #334155; }
      .note { font: 500 11px Arial, Helvetica, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <text x="800" y="34" text-anchor="middle" class="title">BGFC Intramurals Tabulation System</text>
  <text x="800" y="54" text-anchor="middle" class="subtitle">Layered System Architecture</text>

  <!-- USER LAYER -->
  <rect x="40" y="70" width="1520" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="92" class="layer-label">USER LAYER</text>

  <g transform="translate(80,100)">
    <rect width="460" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" class="box-title">Spectator / Public</text>
    <text x="230" y="40" text-anchor="middle" class="box-sub">No login required</text>
  </g>
  <g transform="translate(570,100)">
    <rect width="460" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" class="box-title">Administrator</text>
    <text x="230" y="40" text-anchor="middle" class="box-sub">Full system management</text>
  </g>
  <g transform="translate(1060,100)">
    <rect width="460" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" class="box-title">Tabulator</text>
    <text x="230" y="40" text-anchor="middle" class="box-sub">Assigned-event scoring</text>
  </g>

  <line x1="310" y1="170" x2="310" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="170" x2="800" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1290" y1="170" x2="1290" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PRESENTATION LAYER -->
  <rect x="40" y="200" width="1520" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="222" class="layer-label">PRESENTATION LAYER  -  React 19 + Tailwind CSS + shadcn/ui</text>

  <g transform="translate(70,236)">
    <rect width="480" height="96" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.25"/>
    <text x="240" y="22" text-anchor="middle" class="box-title">Public Site</text>
    <text x="240" y="42" text-anchor="middle" class="box-tiny">Route group: (public)</text>
    <text x="240" y="62" text-anchor="middle" class="box-sub">Home - Live Scores - Standings - Schedule - Rules</text>
    <text x="240" y="82" text-anchor="middle" class="box-tiny">Data fetch: SWR (polling)</text>
  </g>
  <g transform="translate(570,236)">
    <rect width="460" height="96" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.25"/>
    <text x="230" y="22" text-anchor="middle" class="box-title">Authentication</text>
    <text x="230" y="42" text-anchor="middle" class="box-tiny">Route group: (auth)</text>
    <text x="230" y="62" text-anchor="middle" class="box-sub">Staff Sign-In (email + password)</text>
    <text x="230" y="82" text-anchor="middle" class="box-tiny">Redirects signed-in users to dashboard</text>
  </g>
  <g transform="translate(1050,236)">
    <rect width="480" height="96" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.25"/>
    <text x="240" y="22" text-anchor="middle" class="box-title">Staff Dashboard</text>
    <text x="240" y="42" text-anchor="middle" class="box-tiny">Route group: (dashboard)</text>
    <text x="240" y="62" text-anchor="middle" class="box-sub">Seasons - Teams - Events - Matches - Scoreboard - Users</text>
    <text x="240" y="82" text-anchor="middle" class="box-tiny">Data fetch: TanStack Query</text>
  </g>

  <line x1="800" y1="350" x2="800" y2="376" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="370" class="flow">HTTPS / JSON</text>

  <!-- APPLICATION LAYER -->
  <rect x="40" y="380" width="1520" height="168" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="402" class="layer-label">APPLICATION LAYER  -  Next.js App Router (TypeScript)</text>

  <g transform="translate(70,416)">
    <rect width="360" height="112" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
    <text x="180" y="24" text-anchor="middle" class="box-title">API Route Handlers</text>
    <text x="180" y="46" text-anchor="middle" class="box-sub">/api/public/*  /api/matches/*</text>
    <text x="180" y="66" text-anchor="middle" class="box-sub">/api/events/*  /api/seasons  /api/teams</text>
    <text x="180" y="86" text-anchor="middle" class="box-sub">/api/users  /api/points-rules</text>
  </g>
  <g transform="translate(450,416)">
    <rect width="340" height="112" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
    <text x="170" y="24" text-anchor="middle" class="box-title">Access Control</text>
    <text x="170" y="46" text-anchor="middle" class="box-sub">Proxy / middleware gate</text>
    <text x="170" y="66" text-anchor="middle" class="box-sub">assertRole() - assertEventAccess()</text>
    <text x="170" y="86" text-anchor="middle" class="box-tiny">Roles: ADMIN - TABULATOR</text>
  </g>
  <g transform="translate(810,416)">
    <rect width="340" height="112" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
    <text x="170" y="24" text-anchor="middle" class="box-title">NextAuth.js</text>
    <text x="170" y="46" text-anchor="middle" class="box-sub">Credentials provider - JWT session</text>
    <text x="170" y="66" text-anchor="middle" class="box-sub">Session carries id + role</text>
    <text x="170" y="86" text-anchor="middle" class="box-tiny">bcryptjs hashing (cost factor 12)</text>
  </g>
  <g transform="translate(1170,416)">
    <rect width="360" height="112" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
    <text x="180" y="24" text-anchor="middle" class="box-title">Validation</text>
    <text x="180" y="46" text-anchor="middle" class="box-sub">Zod schemas (client + server)</text>
    <text x="180" y="66" text-anchor="middle" class="box-sub">React Hook Form</text>
    <text x="180" y="86" text-anchor="middle" class="box-tiny">Typed request bodies and params</text>
  </g>

  <line x1="800" y1="548" x2="800" y2="574" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="568" class="flow">Validated service calls</text>

  <!-- DOMAIN LAYER -->
  <rect x="40" y="578" width="1520" height="140" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="56" y="600" class="layer-label">DOMAIN / BUSINESS LOGIC LAYER</text>

  <g transform="translate(70,614)">
    <rect width="280" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.25"/>
    <text x="140" y="24" text-anchor="middle" class="box-title">Season Management</text>
    <text x="140" y="46" text-anchor="middle" class="box-sub">Activate season - Points rules</text>
    <text x="140" y="66" text-anchor="middle" class="box-sub">Historical season scope</text>
  </g>
  <g transform="translate(370,614)">
    <rect width="280" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.25"/>
    <text x="140" y="24" text-anchor="middle" class="box-title">Teams and Roster</text>
    <text x="140" y="46" text-anchor="middle" class="box-sub">Teams - Participants</text>
    <text x="140" y="66" text-anchor="middle" class="box-sub">Sports catalog</text>
  </g>
  <g transform="translate(670,614)">
    <rect width="280" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.25"/>
    <text x="140" y="24" text-anchor="middle" class="box-title">Events and Matches</text>
    <text x="140" y="46" text-anchor="middle" class="box-sub">Team-vs-Team - Placement</text>
    <text x="140" y="66" text-anchor="middle" class="box-sub">Tabulator assignment</text>
  </g>
  <g transform="translate(970,614)">
    <rect width="270" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.25"/>
    <text x="135" y="24" text-anchor="middle" class="box-title">Live Scoring</text>
    <text x="135" y="46" text-anchor="middle" class="box-sub">Score increments</text>
    <text x="135" y="66" text-anchor="middle" class="box-sub">Match lifecycle - Winner</text>
  </g>
  <g transform="translate(1260,614)">
    <rect width="270" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.25"/>
    <text x="135" y="24" text-anchor="middle" class="box-title">Standings</text>
    <text x="135" y="46" text-anchor="middle" class="box-sub">Finalize event - Placements</text>
    <text x="135" y="66" text-anchor="middle" class="box-sub">Overall rankings</text>
  </g>

  <line x1="800" y1="718" x2="800" y2="744" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="738" class="flow">Prisma Client queries</text>

  <!-- DATA ACCESS + DATA (side by side for landscape) -->
  <rect x="40" y="748" width="740" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="770" class="layer-label">DATA ACCESS LAYER  -  Prisma ORM 7</text>
  <g transform="translate(60,786)">
    <rect width="700" height="92" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
    <text x="350" y="28" text-anchor="middle" class="box-title">Type-safe Database Bridge</text>
    <text x="350" y="50" text-anchor="middle" class="box-sub">Type-safe queries - Versioned migrations</text>
    <text x="350" y="70" text-anchor="middle" class="box-sub">Atomic score updates - Relational includes</text>
  </g>

  <line x1="780" y1="823" x2="820" y2="823" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="810" text-anchor="middle" class="flow">SQL</text>

  <rect x="820" y="748" width="740" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="836" y="770" class="layer-label">DATA LAYER  -  PostgreSQL</text>
  <g transform="translate(840,786)">
    <rect width="700" height="92" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.25"/>
    <text x="350" y="28" text-anchor="middle" class="box-title">Persistent Storage</text>
    <text x="350" y="50" text-anchor="middle" class="box-sub">Users - Seasons - Teams - Participants - Sports</text>
    <text x="350" y="70" text-anchor="middle" class="box-sub">Sport Events - Matches - Event Placements - Points Rules</text>
  </g>

  <text x="800" y="940" text-anchor="middle" class="note">Cross-cutting concerns: Role-Based Access Control (RBAC) - Input validation - Password hashing - Environment-based configuration</text>
</svg>
